<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="./manifest.json">
<title>筋トレメモ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:16px 14px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:24px;margin:0;font-weight:800}input,textarea,select{width:100%;background:#101010;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#aaa}.date{width:auto!important;min-width:145px}
.card{background:#1b1b1b;border:1px solid #303030;border-radius:16px;padding:14px;margin:12px 0}.exercise-head{display:flex;gap:8px;align-items:center}
.num{font-weight:800;color:#aaa;min-width:26px}.exercise-name{font-size:17px;font-weight:700}.set{border-top:1px solid #333;margin-top:13px;padding-top:13px}
.set-title{font-size:12px;color:#aaa;margin-bottom:7px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.label{font-size:11px;color:#999;margin:0 0 4px}.note{margin-top:8px}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:15px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}.add{width:100%;background:#292929;color:#fff;margin-top:12px;border:1px dashed #666}
.remove{background:#321b1b;color:#ffb0b0;font-size:12px;white-space:nowrap}.remove-set{float:right;background:transparent;color:#aaa;padding:2px 5px;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.primary{background:#fff;color:#111}.secondary{background:#292929;color:#fff}
.section-title{font-size:14px;font-weight:800;margin-bottom:8px}textarea{min-height:110px;resize:vertical}.small{font-size:12px;color:#888;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header><h1>🏋️ 筋トレメモ</h1><input id="date" class="date" type="date"></header>
<div id="exercises"></div>
<button id="addExercise" class="add" type="button">＋ 種目を追加</button>
<div class="card"><div class="section-title">トレーニングMEMO</div>
<textarea id="overall" placeholder="今日のコンディション、感想、次回の課題など"></textarea>
<div class="actions"><button id="clearBtn" class="secondary" type="button">新しく作る</button><button id="saveBtn" class="primary" type="button">💾 保存</button></div>
</div>
<div class="small">入力内容はこの端末のブラウザに保存されます</div>
</div>
<script>
(function(){
"use strict";
var KEY="gymMemoFixedV3",dateEl=document.getElementById("date"),exercisesEl=document.getElementById("exercises"),overallEl=document.getElementById("overall");
function today(){var d=new Date();function z(n){return String(n).padStart(2,"0")}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function rirOptions(v){var s='<option value="">-</option>';for(var i=0;i<=5;i++)s+='<option value="'+i+'" '+(String(v)==String(i)?"selected":"")+'>'+i+"</option>";return s}
function renumber(){var a=exercisesEl.querySelectorAll(".exercise");for(var i=0;i<a.length;i++)a[i].querySelector(".num").textContent=(i+1)+"."}
function renumberSets(card){var a=card.querySelectorAll(".set");for(var i=0;i<a.length;i++)a[i].querySelector(".set-title").textContent="SET "+(i+1)}
function addSet(card,data){data=data||{};var sets=card.querySelector(".sets"),div=document.createElement("div");div.className="set";div.innerHTML='<button class="remove-set" type="button">削除</button><div class="set-title">SET '+(sets.children.length+1)+'</div><div class="grid"><div><div class="label">重量 kg</div><input class="weight" inputmode="decimal" value="'+esc(data.weight)+'"></div><div><div class="label">回数</div><input class="reps" inputmode="numeric" value="'+esc(data.reps)+'"></div><div><div class="label">RIR</div><select class="rir">'+rirOptions(data.rir)+'</select></div></div><div class="note"><div class="label">セットメモ</div><input class="set-note" placeholder="フォーム、感覚、失敗点など" value="'+esc(data.note)+'"></div>';sets.appendChild(div)}
function addExercise(data){data=data||{name:"",sets:[]};var card=document.createElement("div");card.className="card exercise";card.innerHTML='<div class="exercise-head"><div class="num">1.</div><input class="exercise-name" placeholder="種目名を入力" value="'+esc(data.name)+'"><button class="remove remove-exercise" type="button">削除</button></div><div class="sets"></div><button class="add add-set" type="button">＋ セットを追加</button>';exercisesEl.appendChild(card);if(data.sets&&data.sets.length){for(var i=0;i<data.sets.length;i++)addSet(card,data.sets[i])}else addSet(card);renumber()}
function removeExercise(btn){var card=btn.closest(".exercise");if(card)card.remove();if(!exercisesEl.children.length)addExercise();renumber()}
function collect(){var cards=exercisesEl.querySelectorAll(".exercise"),ex=[];for(var i=0;i<cards.length;i++){var c=cards[i],ss=c.querySelectorAll(".set"),sets=[];for(var j=0;j<ss.length;j++){var s=ss[j];sets.push({weight:s.querySelector(".weight").value,reps:s.querySelector(".reps").value,rir:s.querySelector(".rir").value,note:s.querySelector(".set-note").value})}ex.push({name:c.querySelector(".exercise-name").value,sets:sets})}return{date:dateEl.value,overall:overallEl.value,exercises:ex}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(collect()));alert("保存しました！")}catch(e){alert("保存できませんでした。")}}
function load(){dateEl.value=today();try{var raw=localStorage.getItem(KEY);if(!raw){addExercise();return}var d=JSON.parse(raw);dateEl.value=d.date||today();overallEl.value=d.overall||"";exercisesEl.innerHTML="";if(d.exercises&&d.exercises.length){for(var i=0;i<d.exercises.length;i++)addExercise(d.exercises[i])}else addExercise()}catch(e){exercisesEl.innerHTML="";addExercise()}}
dateEl.value=today();
document.getElementById("addExercise").addEventListener("click",function(){addExercise()});
document.getElementById("saveBtn").addEventListener("click",save);
document.getElementById("clearBtn").addEventListener("click",function(){if(confirm("入力内容を消して新しく作りますか？")){exercisesEl.innerHTML="";overallEl.value="";addExercise()}});
exercisesEl.addEventListener("click",function(e){var t=e.target;if(t.classList.contains("add-set")){var c=t.closest(".exercise");addSet(c);renumberSets(c)}else if(t.classList.contains("remove-set")){var c=t.closest(".exercise");t.closest(".set").remove();if(!c.querySelector(".set"))addSet(c);renumberSets(c)}else if(t.classList.contains("remove-exercise"))removeExercise(t)});
load();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=3").catch(function(){});
})();
</script>
</body>
</html>
